<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>Game Hub</title>
<link rel="stylesheet" href="css/hub.css"></head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<header class="top"><div class="brand"><img id="hubLogo" alt=""><div><b id="hubName">Game Hub</b><small id="hubTag"></small></div></div>
<button id="musicBtn" class="ib" aria-label="Music">🔊</button></header>
<div class="search"><input id="q" type="search" placeholder="🔍 Search games..." aria-label="Search"></div>
<main id="app"><div class="skel"></div></main>
<footer><span id="ver"></span> · Made with ❤️ by Shadow Arc Games</footer>
<div id="ad" class="ad"></div>
<section id="player" hidden><div class="pbar"><button id="back" class="btn">← Back to Hub</button><b id="ptitle"></b><button id="fs" class="ib" aria-label="Fullscreen">⛶</button></div>
<div id="pstate" class="pstate">Loading…</div><iframe id="frame" title="Game Player" allow="autoplay; fullscreen" allowfullscreen></iframe></section>
<div id="toast"></div>
<script src="data/settings.js"></script>
<script src="data/games.js"></script>
<script src="data/themes.js"></script>
<script src="js/bg.js"></script>
<script src="js/app.js"></script>
<script src="js/admob-bridge.js"></script>
<script src="js/store.js"></script></body></html>
