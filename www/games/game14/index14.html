cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=lw;cx.strokeStyle=hc?'rgba(255,255,255,.6)':'rgba(255,255,255,.22)';cx.beginPath();g.E.forEach(([a,b],i)=>{if(!s.used[i]){cx.moveTo(sp[a].x,sp[a].y);cx.lineTo(sp[b].x,sp[b].y)}});cx.stroke();
cx.shadowBlur=glow;for(let i=0;i<g.E.length;i++)if(s.used[i]){const f=sp[s.dir[i]],e=g.E[i],t=sp[e[0]===s.dir[i]?e[1]:e[0]],p=s.ap[i];cx.strokeStyle=cx.shadowColor=C[s.col[i]];cx.beginPath();cx.moveTo(f.x,f.y);cx.lineTo(f.x+(t.x-f.x)*p,f.y+(t.y-f.y)*p);cx.stroke()}cx.shadowBlur=0;
if(s.drag&&s.cur>=0&&!s.done){const c=sp[s.cur];cx.strokeStyle=C[0];cx.globalAlpha=.55;cx.lineWidth=lw*.7;cx.beginPath();cx.moveTo(c.x,c.y);cx.lineTo(s.ptr.x,s.ptr.y);cx.stroke();cx.globalAlpha=1}
if(s.hint){cx.strokeStyle='#ffd76a';cx.lineWidth=lw+3;cx.setLineDash([9,9]);cx.lineDashOffset=-now*40;cx.globalAlpha=.6+.4*pu;cx.beginPath();s.hint.e.forEach(i=>{const e=g.E[i];cx.moveTo(sp[e[0]].x,sp[e[0]].y);cx.lineTo(sp[e[1]].x,sp[e[1]].y)});cx.stroke();cx.setLineDash([]);cx.globalAlpha=1}
if(s.assist){const q=s.assist,ns=q.ns;cx.strokeStyle='#ffd76a';cx.lineWidth=lw+2;cx.shadowColor='#ffb300';cx.shadowBlur=glow;cx.beginPath();for(let k=0;k<ns.length-1&&k<q.t;k++){const a=sp[ns[k]],b=sp[ns[k+1]],p=Math.min(1,q.t-k);cx.moveTo(a.x,a.y);cx.lineTo(a.x+(b.x-a.x)*p,a.y+(b.y-a.y)*p)}cx.stroke();cx.shadowBlur=0}
if(sv.set.dev&&s===G){cx.fillStyle='#fff';cx.font='11px monospace';cx.textAlign='center';g.E.forEach((e,i)=>{cx.fillStyle='#ffd76a';cx.fillText('e'+i+'#'+g.sol.indexOf(i),(sp[e[0]].x+sp[e[1]].x)/2,(sp[e[0]].y+sp[e[1]].y)/2)})}
const ng=new Set();if(s.cur>=0&&!s.done)g.adj[s.cur].forEach(([n,i])=>{if(!s.used[i])ng.add(n)});
for(let i=0;i<g.n;i++){const p=sp[i],c=C[i%3],isS=s.cur<0&&g.starts.includes(i)&&(sv.diff===0||g.fixed||(s.hint&&s.hint.n.includes(i))||s===demo);
if(s.vis[i]||i===s.cur){cx.shadowColor=c;cx.shadowBlur=glow}cx.fillStyle=c;cx.globalAlpha=.22;shp(p.x,p.y,R*1.6);cx.fill();cx.globalAlpha=1;cx.fillStyle=s.vis[i]?c:'#f4f8ff';shp(p.x,p.y,R*(i===s.cur?1.25:1));cx.fill();cx.shadowBlur=0;cx.fillStyle='rgba(255,255,255,.75)';cx.beginPath();cx.arc(p.x-R*.3,p.y-R*.3,R*.28,0,6.2832);cx.fill();
if(isS||(s.hint&&s.hint.n.includes(i))){cx.strokeStyle='#ffd76a';cx.lineWidth=3;shp(p.x,p.y,R*(1.7+.35*pu));cx.stroke()}else if(ng.has(i)){cx.strokeStyle=C[0];cx.lineWidth=2.5;cx.globalAlpha=.5+.5*pu;shp(p.x,p.y,R*(1.6+.3*pu));cx.stroke();cx.globalAlpha=1}
else if(sv.diff===0&&s===G&&s.cur>=0&&g.odd.length===2&&i===g.odd.find(o=>o!==s.path[0])&&!s.done){cx.strokeStyle=C[2];cx.lineWidth=2;cx.setLineDash([4,4]);shp(p.x,p.y,R*1.7);cx.stroke();cx.setLineDash([])}
if(sv.set.dev&&s===G){cx.fillStyle='#fff';cx.font='bold 11px monospace';cx.textAlign='center';cx.fillText(g.deg[i],p.x,p.y-R*1.8)}}
if(s.cur>=0&&!s.done){cx.strokeStyle='#fff';cx.lineWidth=2;shp(sp[s.cur].x,sp[s.cur].y,R*1.7);cx.globalAlpha=.8;cx.stroke();cx.globalAlpha=1}}
function draw(){const th=TH[sv.theme];cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle=bgG||th.bg[0];cx.fillRect(0,0,W,H);
if(th.fx===2){cx.strokeStyle=th.c[1];cx.globalAlpha=.16;cx.lineWidth=1;cx.beginPath();for(let i=-8;i<=8;i++){cx.moveTo(W/2,H*.62);cx.lineTo(W/2+i*W*.28,H)}for(let k=0;k<7;k++){const y=H*.62+(H*.38)*Math.pow((k+(now*.4%1))/7,2);cx.moveTo(0,y);cx.lineTo(W,y)}cx.stroke();cx.globalAlpha=1}
bgp.forEach(p=>{cx.globalAlpha=th.fx===1?.35+.55*Math.abs(Math.sin(now*1.5+p.p)):.2;cx.fillStyle=th.c[(p.s|0)%3];cx.beginPath();cx.arc(p.x*W,p.y*H,th.fx===1?p.s*.7:p.s*1.6,0,6.2832);cx.fill()});cx.globalAlpha=1;
if(scr==='game'||scr==='pause'||scr==='res'){if(G){if(G.flash>0){cx.fillStyle=`rgba(255,50,90,${G.flash*.2})`;cx.fillRect(0,0,W,H)}drawState(G)}}else if(demo&&demo.g)drawState(demo);
rings.forEach(r=>{if(r.l>0){cx.strokeStyle=th.c[(r.r|0)%3];cx.globalAlpha=Math.min(1,r.l);cx.lineWidth=4;cx.beginPath();cx.arc(r.x,r.y,r.r,0,6.2832);cx.stroke()}});bursts.forEach(b=>{if(b.l>0){cx.globalAlpha=Math.min(1,b.l);cx.fillStyle=th.c[b.c];cx.fillRect(b.x-2,b.y-2,4,4)}});cx.globalAlpha=1}
let last=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;if(document.hidden)return;now=t/1000;update(dt);draw()}
setTheme(sv.theme);resize();go('menu');requestAnimationFrame(loop);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
