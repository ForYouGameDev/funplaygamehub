<style>

.btn{border:0;border-radius:1.1em;padding:.7em 1.3em;font:800 1em inherit;font-family:inherit;color:#fff;background:linear-gradient(#ffb347,#ff6a3d);box-shadow:0 .3em 0 #b8431f,0 .5em .8em #0005;cursor:pointer;margin:.3em 0 .45em}

#sm.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-.5em)}75%{transform:translateX(.5em)}}

</style></head><body>
<div id="app">
<canvas id="cv"></canvas>
<div id="hud"><button class="ib" id="bMenu" aria-label="Menu">☰</button><div id="lv"></div><button class="ib" id="bUndo" aria-label="Undo">↶</button><button class="ib" id="bRe" aria-label="Restart">⟳</button><button class="ib" id="bHint" aria-label="Hint">💡</button></div>

</div>
<script>
"use strict";
const W=360,H=640,CS=4,GW=90,GH=160,R=9,TOP=150,MAXL=1000;let BR=12;
const $=s=>document.querySelector(s);
const T=[
{n:"Sunny Beach",sky:["#5cbfff","#d8f3ff"],hill:"#7fd6a0",sand:["#f6d37a","#e9a94b"],grain:"#b97c2c",under:"#7a5a3a",sun:"#fff2a8",ball:["#ff8a5c","#ff3d6e"],accent:"#ff5d8f",stone:"#8a8f9c",c:"#5cbfff"},
{n:"Candy Land",sky:["#ffa6df","#fff0fb"],hill:"#ffd1f0",sand:["#ffc3dc","#f78fb7"],grain:"#c94a85",under:"#6a2a55",sun:"#fff6b0",ball:["#7be0ff","#3d7bff"],accent:"#ff4fa3",stone:"#b59bff",c:"#ff7ac8"},
{n:"Ice Cave",sky:["#17335c","#5aa9d6"],hill:"#8fd3ee",sand:["#e8f6ff","#a9d4ee"],grain:"#5e96b8",under:"#0e2236",sun:"#e8faff",ball:["#ffd86b","#ff9a2e"],accent:"#4fd0ff",stone:"#52708f",dark:1,c:"#4fa6d8"},
{n:"Lava Cave",sky:["#2a0f10","#8a3014"],hill:"#4a1a10",sand:["#c4743c","#8b4a2a"],grain:"#3e1c0e",under:"#1a0806",sun:"#ff7a2a",ball:["#fff27a","#ff9d1a"],accent:"#ff5a1f",stone:"#4d4a52",dark:1,c:"#c4481c"},
{n:"Neon Galaxy",sky:["#0b0630","#3b1a7a"],hill:"#2a1a66",sand:["#8a5cff","#4b2fb5"],grain:"#c3b0ff",under:"#080320",sun:"#d8c6ff",ball:["#7affc8","#00d1ff"],accent:"#ff3df0",stone:"#2f3a6b",dark:1,c:"#8a5cff"},
{n:"Golden Desert",sky:["#ffb35c","#fff1d0"],hill:"#e8b66a",sand:["#ffd873","#e08a2e"],grain:"#a8601c",under:"#6e4220",sun:"#fff7c2",ball:["#5cd6ff","#2f5bff"],accent:"#2fbf9b",stone:"#9c7a5a",c:"#ffb35c"}
];
/* ---------- save ---------- */
const save={v:1,coins:0,unlocked:1,stars:{},theme:-1,snd:true,hap:true,tut:false};
try{const s=JSON.parse(localStorage.getItem("dsd1"));if(s&&s.v===1){save.coins=Math.max(0,+s.coins||0);save.unlocked=Math.min(MAXL,Math.max(1,+s.unlocked||1));save.stars=s.stars&&typeof s.stars==="object"?s.stars:{};const t=s.theme|0;save.theme=t>=-1&&t<T.length?t:-1;save.snd=s.snd!==false;save.hap=s.hap!==false;save.tut=!!s.tut}}catch(e){}
function persist(){try{localStorage.setItem("dsd1",JSON.stringify(save))}catch(e){}}
/* ---------- icons (inline SVG, no emoji, fully offline) ---------- */
const SV=(p,s)=>'<svg viewBox="0 0 24 24" width="'+(s||20)+'" height="'+(s||20)+'" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle">'+p+'</svg>';
const IC={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',undo:'<path d="M9 6 4 11l5 5M4 11h10a5 5 0 0 1 0 10h-4"/>',redo:'<path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',snd:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',mute:'<path d="M4 9v6h4l5 4V5L8 9H4zM17 9l5 6M22 9l-5 6"/>',vib:'<rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 8v8M20 8v8"/>',vibx:'<rect x="8" y="3" width="8" height="18" rx="2"/><path d="M3 3l18 18"/>',q:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.01"/>',dig:'<path d="M6 3l12 9-5 1 3 6-3 1.5-3-6-4 3z"/>',stone:'<path d="M3 15l3-7h9l5 5-1 5H5z"/>',gem:'<path d="M7 4h10l4 5-9 11L3 9z"/><path d="M3 9h18M9 4l-2 5 5 11 5-11-2-5"/>',zoom:'<circle cx="10" cy="10" r="6"/><path d="M15 15l6 6M7.5 10h5M10 7.5v5"/>'};
const star=(on,s)=>'<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" style="vertical-align:middle;margin:0 .05em"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z" fill="'+(on?"#ffd35a":"none")+'" stroke="#ffd35a" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const stars=(n,s)=>star(n>0,s)+star(n>1,s)+star(n>2,s);
const COIN='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:middle"><circle cx="12" cy="12" r="10" fill="#ffc21a" stroke="#b8741a" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#b8741a" stroke-width="2"/></svg>';
function icons(){const m={"#bMenu":"menu","#bUndo":"undo","#bRe":"redo","#bHint":"bulb","#zIn":"plus","#zOut":"minus","#zFit":"target"};for(const k in m)$(k).innerHTML=SV(IC[m[k]],18);$("#bHow").innerHTML=SV(IC.q,15)+" How to play"}
/* ---------- audio / haptics ---------- */
let ac;
function snd(f,d=.08,ty="sine",v=.07,sl=0){if(!save.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function vib(ms){if(save.hap&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
/* ---------- level generator (seeded, always solvable: all sand is diggable) ---------- */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function corr(s,bx,cx){const pts=[];for(let y=TOP;y<=330;y+=8)pts.push([bx,y]);for(let x=Math.min(bx,cx);x<=Math.max(bx,cx);x+=8)pts.push([x,330]);for(let y=330;y<=H-50;y+=8)pts.push([cx,y]);return pts.some(p=>p[0]>s.x-18&&p[0]<s.x+s.w+18&&p[1]>s.y-18&&p[1]<s.y+s.h+18)}
function gen(id){
const d=id>=1e5?60+(id%300):id,r=rng(id*7919+13),rv=(a,b)=>a+r()*(b-a);
const bx=rv(70,290);let cx=rv(50,310);if(Math.abs(cx-bx)<110)cx=bx<180?rv(250,310):rv(50,110);
const L={id,d,bx,cx,cy:H-50,ph:rv(0,6),amp:d<11?4:rv(6,16),stones:[],pockets:[],coins:[],par:Math.min(6,2+(d/25|0)),limit:d>25?Math.max(4,9-(d/100|0)):0,br:Math.max(10,12-d/250),ink:0};
const pl=(330-TOP)+Math.abs(cx-bx)+(H-380);if(d>50)L.ink=Math.round(pl*(2.4-Math.min(1.1,d/700)));
const ns=d<11?0:Math.min(24,1+((d-11)/9|0));
for(let i=0;i<ns*3&&L.stones.length<ns;i++){const w=rv(60,110),s={x:rv(15,345-w),y:rv(240,520),w,h:rv(14,22)};
if(s.x+s.w>cx-60&&s.x<cx+60&&s.y>L.cy-140)continue;if(corr(s,bx,cx))continue;L.stones.push(s)}
const np=d<5?1:Math.max(1,3-(d/200|0));for(let i=0;i<np;i++)L.pockets.push({x:rv(40,320),y:rv(260,560),r:rv(18,32)});
for(let i=0;i<3;i++){let p,k=0;do{p={x:rv(40,320),y:rv(230,560)};k++}while(k<20&&L.stones.some(s=>p.x>s.x-14&&p.x<s.x+s.w+14&&p.y>s.y-14&&p.y<s.y+s.h+14));L.coins.push(p)}
return L}
const topY=x=>TOP+Math.sin(x*.02+L.ph)*L.amp;
/* ---------- state ---------- */
const S=Math.min(window.devicePixelRatio||1,2),app=$("#app"),cv=$("#cv"),ctx=cv.getContext("2d");
cv.width=W*S;cv.height=H*S;
const mk=()=>{const c=document.createElement("canvas");c.width=W*S;c.height=H*S;return c};
const bg=mk(),base=mk(),terr=mk(),tc=terr.getContext("2d");
const grid=new Uint8Array(GW*GH);
let L,th=T[0],state="menu",strokes=[],cur=null,last=null,ptr=null,drawing=false,ball,coinsL=[],gotC=0,fill=0,hintT=0,stuck=0,winT=0,sq=0,debug=false,curId=0,tt=0;
const themeOf=id=>save.theme<0?T[(((id>=1e5?5:id-1)/10)|0)%T.length]:T[save.theme];
/* ---------- particles (pooled) ---------- */
const P=[];for(let i=0;i<180;i++)P.push({on:0,x:0,y:0,vx:0,vy:0,l:0,m:1,c:"#fff",s:2,g:1});
let pi=0;
function spawn(x,y,vx,vy,l,c,s,g=1){const p=P[pi=(pi+1)%P.length];p.on=1;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.l=p.m=l;p.c=c;p.s=s;p.g=g}
/* ---------- painting (cached) ---------- */
function paintBg(){
const c=bg.getContext("2d");c.setTransform(S,0,0,S,0,0);
let g=c.createLinearGradient(0,0,0,TOP+40);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
const r=rng(5);
if(th.dark){c.fillStyle="#fff";for(let i=0;i<50;i++){c.globalAlpha=.3+r()*.7;c.fillRect(r()*W,r()*TOP,1.6,1.6)}c.globalAlpha=1}
c.fillStyle=th.sun;c.beginPath();c.arc(290,62,26,0,7);c.fill();
c.fillStyle=th.dark?"rgba(255,255,255,.08)":"rgba(255,255,255,.75)";
for(const [x,y,s] of [[70,50,1],[200,85,.8],[300,115,.6]]){c.beginPath();c.ellipse(x,y,34*s,12*s,0,0,7);c.ellipse(x+18*s,y-9*s,20*s,13*s,0,0,7);c.ellipse(x-16*s,y-5*s,16*s,10*s,0,0,7);c.fill()}
c.fillStyle=th.hill;c.beginPath();c.moveTo(0,TOP+10);for(let x=0;x<=W;x+=10)c.lineTo(x,TOP-26+Math.sin(x*.03+1)*16);c.lineTo(W,TOP+10);c.fill();
c.fillStyle=th.under;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=6)c.lineTo(x,topY(x));c.lineTo(W,H);c.fill();
g=c.createLinearGradient(0,TOP,0,H);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.45)");c.fillStyle=g;c.fill();
}
function paintSand(){
const c=base.getContext("2d");c.setTransform(S,0,0,S,0,0);c.clearRect(0,0,W,H);
const path=()=>{c.beginPath();c.moveTo(0,topY(0));for(let x=0;x<=W;x+=6)c.lineTo(x,topY(x));c.lineTo(W,H);c.lineTo(0,H);c.closePath()};
const g=c.createLinearGradient(0,TOP-20,0,H);g.addColorStop(0,th.sand[0]);g.addColorStop(1,th.sand[1]);
path();c.fillStyle=g;c.fill();c.save();path();c.clip();
const r=rng(L.id+99);
for(let i=0;i<900;i++){c.globalAlpha=.15+r()*.3;c.fillStyle=r()<.7?th.grain:"#fff";c.fillRect(r()*W,TOP-20+r()*(H-TOP+20),1+r()*1.6,1+r()*1.6)}
c.globalAlpha=.35;c.fillStyle=th.grain;for(let i=0;i<22;i++){c.beginPath();c.ellipse(r()*W,TOP+30+r()*(H-TOP),2+r()*4,1.5+r()*3,r()*3,0,7);c.fill()}
c.globalAlpha=1;c.restore();
c.strokeStyle="rgba(255,255,255,.55)";c.lineWidth=3;c.beginPath();c.moveTo(0,topY(0)+1);for(let x=0;x<=W;x+=6)c.lineTo(x,topY(x)+1);c.stroke();
}
/* ---------- terrain ---------- */
function carveG(x,y,r){const x0=Math.max(0,(x-r)/CS|0),x1=Math.min(GW-1,(x+r)/CS|0),y0=Math.max(0,(y-r)/CS|0),y1=Math.min(GH-1,(y+r)/CS|0);
for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++){const dx=(i+.5)*CS-x,dy=(j+.5)*CS-y;if(dx*dx+dy*dy<=r*r&&grid[j*GW+i]===1)grid[j*GW+i]=0}}
function digSeg(a,b){
