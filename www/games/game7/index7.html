function star(x,y,r,t){cx.save();cx.translate(x,y);cx.rotate(Math.sin(t*3+x)*.2);cx.beginPath();for(let i=0;i<10;i++){const q=i%2?r*.5:r,a=i*Math.PI/5-Math.PI/2;i?cx.lineTo(Math.cos(a)*q,Math.sin(a)*q):cx.moveTo(Math.cos(a)*q,Math.sin(a)*q)}cx.closePath();cx.fillStyle='#ffd23f';cx.fill();cx.lineWidth=2;cx.strokeStyle='#f08a00';cx.lineJoin='round';cx.stroke();cx.fillStyle='#fff9';cx.beginPath();cx.arc(-r*.25,-r*.3,r*.15,0,7);cx.fill();cx.restore()}
// Classroom backdrop: windows + blackboards scrolling in parallax, wooden floor
const CH=['1+1=2','A B C','a²+b²=c²','Hi :)'];
function scene(){const d=dist*.15,P=330,n0=Math.floor(d/P);cx.save();cx.globalAlpha=.55;
 for(let k=0;k<3;k++){const wx=-(d%P)+k*P,bx=wx+P/2,n=n0+k;
  cx.fillStyle='#8fd0ff';cx.fillRect(wx+20,60,100,120);cx.fillStyle='#fff';cx.beginPath();cx.arc(wx+45,95,10,0,7);cx.fill();cx.beginPath();cx.arc(wx+60,90,13,0,7);cx.fill();
  cx.strokeStyle='#c98a4b';cx.lineWidth=7;cx.strokeRect(wx+20,60,100,120);cx.lineWidth=4;cx.beginPath();cx.moveTo(wx+70,60);cx.lineTo(wx+70,180);cx.moveTo(wx+20,120);cx.lineTo(wx+120,120);cx.stroke();
  cx.fillStyle='#2f6b4f';cx.fillRect(bx,380,130,90);cx.strokeStyle='#8a5a2b';cx.lineWidth=6;cx.strokeRect(bx,380,130,90);
  cx.fillStyle='#fff';cx.font='bold 17px cursive';cx.textAlign='left';cx.fillText(CH[n%4],bx+14,415);cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.arc(bx+65,440,12,.2,Math.PI-.2);cx.stroke()}
 cx.globalAlpha=.8;cx.fillStyle='#a56a35';cx.fillRect(0,H-14,W,14);cx.fillStyle='#7a4a22';for(let i=0;i<9;i++)cx.fillRect(((i*45-dist*.6)%W+W)%W,H-14,2,14);cx.restore()}
function rs(){const s=Math.min(innerWidth/W,innerHeight/H)*.98,d=Math.min(devicePixelRatio||1,2);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);ov.style.width=W*s+'px';ov.style.height=H*s+'px'}
addEventListener('resize',rs);rs();
// ===== Game state =====
let S='menu',L,P,dist,tm,sc,got,pass,quick=0,chunk=0,qs=0,tr=[],par=[],shake=0,last=0,selW=0,cur=1;
function start(n,q){quick=q||0;if(q&&!qs){chunk=0;qs=0}cur=n;L=gen(quick?1+(chunk*53+n)%1000:n);P={y:320,vy:0};dist=0;tm=0;got=0;pass=0;sc=quick?qs:0;tr=[];par=[];ov.className='h';S='play'}
function flap(){if(S!=='play')return;P.vy=-330;tone(520,.12,'triangle',.08,900);for(let k=0;k<3;k++)par.push({x:80,y:P.y,vx:-40-Math.random()*40,vy:Math.random()*40-20,l:.4})}
function die(){S='dead';shake=.3;tone(300,.4,'sawtooth',.12,60);if(quick){qs=0}
 show(`<h1>Crunch! 📄💥</h1><p>Score ${sc}</p><button onclick="start(cur,quick)">Retry</button><button class="s" onclick="menu()">Menu</button>`)}
function win(){S='win';tone(660,.15,'square',.08);setTimeout(()=>tone(880,.25,'square',.08),150);
 if(quick){chunk++;qs=sc;start(cur,1);return}
 const tot=L.stars.length,s=got>=tot?3:got>=tot/2?2:1,old=sv.best[cur]||[0,0];
 sv.best[cur]=[Math.max(old[0],s),Math.max(old[1],sc)];sv.max=Math.max(sv.max,Math.min(1000,cur+1));save();
 show(`<h1>Level ${cur} Complete!</h1><div style="font-size:36px">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><p>Score ${sc} (best ${sv.best[cur][1]})<br>Stars collected ${got}/${tot}</p>${cur<1000?`<button onclick="start(${cur+1})">Next Level</button>`:'<p>🏆 Paper Master!</p>'}<button class="s" onclick="start(cur)">Retry</button><button class="s" onclick="lsel()">Levels</button>`)}
// ===== Update =====
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,t=cl(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function cyOf(o){return o.cy+o.amp*Math.sin(tm*o.f+o.ph)}
function upd(dt){tm+=dt;dist+=L.spd*dt;
 P.vy=Math.min(P.vy+(L.moon?900:1300)*dt+(L.wind?Math.sin(dist/150)*220*dt:0),480);P.y+=P.vy*dt;
 tr.push({x:dist+80,y:P.y});if(tr.length>14)tr.shift();
 if(P.y<R||P.y>H-R)return die();
 const px=dist+80;
 for(const o of L.obs){const sx=o.x;if(sx>px+60||sx+PW<px-60)continue;const cy=cyOf(o),f=3;
  if(px+R-f>sx&&px-R+f<sx+PW&&(P.y-R+f<cy-o.gap/2||P.y+R-f>cy+o.gap/2))return die();
  if(o.hz=='bar'){const a=tm*2+o.ph,l=o.gap*.3,c=Math.cos(a)*l,s=Math.sin(a)*l;if(segD(px,P.y,sx+PW/2-c,cy-s,sx+PW/2+c,cy+s)<R+2)return die()}
  if(o.hz=='orb'){const a=tm*2.2+o.ph,rr=o.gap*.35;if(Math.hypot(px-(sx+PW/2+Math.cos(a)*rr),P.y-(cy+Math.sin(a)*rr))<R+6)return die()}
  if(o.hz=='sweep'){const sy=cy+Math.sin(tm*2+o.ph)*o.gap*.32;if(px+R>sx-5&&px-R<sx+PW+5&&Math.abs(P.y-sy)<R+3)return die()}
  if(o.hz=='drop'){const dy=cy-o.gap/2+10+((tm*70+o.ph*30)%(o.gap-20));if(Math.hypot(px-(sx+PW/2),P.y-dy)<R+5)return die()}
  if(!o.p&&sx+PW<px){o.p=1;pass++;sc+=10;tone(440,.08,'sine',.06)}}
 for(const s of L.stars)if(!s.got&&Math.hypot(px-s.x,P.y-s.y)<R+10){s.got=1;got++;sc+=5;tone(1200,.15,'sine',.1,1800);for(let k=0;k<6;k++)par.push({x:80,y:P.y,vx:Math.random()*120-60,vy:Math.random()*120-60,l:.5})}
 for(const p of par){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}par=par.filter(p=>p.l>0);
 if(px>L.len)win()}
// ===== Render =====
function draw(){const w=L?L.w:0,hu=w*36;cx.save();if(shake>0){cx.translate(Math.random()*6-3,Math.random()*6-3)}
 const sg=cx.createLinearGradient(0,0,0,H);sg.addColorStop(0,T.s1);sg.addColorStop(1,T.s2);cx.fillStyle=sg;cx.fillRect(0,0,W,H);
 cx.strokeStyle=T.line;for(let y=40;y<H;y+=32){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
 if(!L){menuScene();cx.restore();return}
 scene();cx.globalAlpha=.32;cx.font='26px serif';cx.textAlign='center';for(let k=0;k<6;k++){const x=((k*97-dist*.3)%(W+80)+W+80)%(W+80)-40;cx.fillText(DO[k],x,90+k*95)}cx.globalAlpha=1;
 const off=dist;
 for(const o of L.obs){const x=o.x-off;if(x<-60||x>W+20)continue;const cy=cyOf(o),a=cy-o.gap/2,b=cy+o.gap/2;
  pil(x,0,a,1,o);pil(x,b,H,0,o);
  
  cx.textAlign='center';
  if(o.hz=='bar'){const q=tm*2+o.ph,l=o.gap*.3;cx.strokeStyle='#c0392b';cx.lineWidth=6;cx.beginPath();cx.moveTo(x+PW/2-Math.cos(q)*l,cy-Math.sin(q)*l);cx.lineTo(x+PW/2+Math.cos(q)*l,cy+Math.sin(q)*l);cx.stroke()}
  if(o.hz=='sweep'){{const ry=cy+Math.sin(tm*2+o.ph)*o.gap*.32-4;cx.fillStyle='#ffd23f';cx.fillRect(x-5,ry,PW+10,8);cx.strokeStyle='#0005';cx.strokeRect(x-5,ry,PW+10,8);cx.fillStyle='#8a6d00';for(let q=0;q<PW+10;q+=5)cx.fillRect(x-5+q,ry,1,q%10?3:5)}}
  if(o.hz=='drop'){cx.fillStyle=T.fg;cx.beginPath();cx.arc(x+PW/2,cy-o.gap/2+10+((tm*70+o.ph*30)%(o.gap-20)),6,0,7);cx.fill()}
  if(o.hz=='orb'){const q=tm*2.2+o.ph,rr=o.gap*.35;cx.fillStyle='#8e44ad';cx.beginPath();cx.arc(x+PW/2+Math.cos(q)*rr,cy+Math.sin(q)*rr,8,0,7);cx.fill()}}
 for(const s of L.stars)if(!s.got){const x=s.x-off;if(x>-20&&x<W+20){star(x,s.y+Math.sin(tm*4+s.x)*3,11,tm)}}
 const fx=L.len-off;cx.fillStyle='#27ae60';cx.fillRect(fx,0,8,H);cx.fillStyle='#fff';cx.font='bold 11px sans-serif';cx.fillText('FINISH',fx+4,20);
 cx.strokeStyle='#ffffffaa';cx.lineWidth=4;cx.lineCap='round';cx.beginPath();tr.forEach((t,k)=>k?cx.lineTo(t.x-off,t.y):cx.moveTo(t.x-off,t.y));cx.stroke();
 for(const p of par){cx.globalAlpha=p.l*2;cx.fillStyle='#f1c40f';cx.fillRect(p.x,p.y,4,4)}cx.globalAlpha=1;
 bird(80,P.y,Math.atan2(P.vy,300),tm,P.vy<-100);
 cx.fillStyle=T.hud;cx.fillRect(0,0,W,30);cx.fillStyle=T.fg;cx.font='bold 13px sans-serif';cx.textAlign='left';
 cx.fillText(`${quick?'Quick':'L'+L.n} · ${WN[w]}`,8,20);cx.textAlign='right';cx.fillText(`⭐${got}/${L.stars.length}  ${sc}`,W-46,20);cx.fillRect(W-30,7,5,16);cx.fillRect(W-20,7,5,16);
 cx.fillStyle='#e0533d';cx.fillRect(0,28,W*Math.min(1,(dist+80)/L.len),3);
 if(L.n==1&&!quick&&tm<7&&S==='play'){cx.fillStyle=T.fg;cx.font='bold 20px sans-serif';cx.textAlign='center';cx.fillText(tm<3.5?'👆 TAP to flap!':'Fly through the gaps!',W/2,H*.3)}
 if(S==='pause'){cx.fillStyle='#0008';cx.fillRect(0,0,W,H)}cx.restore()}
// ===== Loop (single rAF, clamped dt, pauses when hidden) =====
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000||0,.033);last=t;if(shake>0)shake-=dt;if(S==='play')upd(dt);draw()}
requestAnimationFrame(loop);
// ===== Input =====
const down=e=>{if(S==='play'){e.preventDefault();const r=cv.getBoundingClientRect();if((e.clientX-r.left)/r.width*W>W-40&&(e.clientY-r.top)/r.height*H<34)pause();else flap()}};
cv.addEventListener('pointerdown',down);
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){if(S==='play'){e.preventDefault();flap()}}
 if(e.code==='Escape'||e.code==='KeyP'){if(S==='play')pause();else if(S==='pause')resume()}});
function pause(){if(S!=='play')return;S='pause';pm()}
function pm(){show(`<h1>Paused</h1><button onclick="resume()">▶ Resume</button><button class="s" onclick="start(cur,quick)">↻ Restart</button><button class="s" onclick="howto('pm()')">❓ How to Play</button><button class="s" onclick="cycTheme()">🎨 Theme: ${sv.th&&TH[sv.th]?TH[sv.th].n:'Auto'}</button><button class="s" onclick="menu()">🏠 Menu</button>`)}
function cycTheme(){const k=['auto',...Object.keys(TH)];sv.th=k[(k.indexOf(sv.th||'auto')+1)%k.length];save();applyTheme();pm()}
function howto(b){show(`<h1>How to Play</h1><p style="max-width:280px;text-align:left;line-height:1.55;font-size:14px">👆 Tap / click / Space = flap<br>⏸ Pause: top-right icon, Esc or P<br>⭐ Collect stars (all = 3 stars)<br>🚧 Fly between pencils, erasers &amp; sharpeners<br><br><b>Hazards by world</b><br>🟠 Sliding ruler (W2, W5, W8, W10)<br>⚫ Falling chalk drop (W3, W5, W10)<br>🔴 Spinning fan blade (W4, W8, W10)<br>🟣 Orbiting ball (W6, W9, W10)<br>🌬 Wind gusts (W7) · 🌙 Low gravity (W9)<br>Moving gaps appear in W2, W8, W10</p><button onclick="${b}">Back</button>`)}
function resume(){ov.className='h';S='play'}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
// ===== Menus =====
function show(h){ov.className='';ov.innerHTML=h}
function menu(){S='menu';L=null;show(`<h1 style="font-size:48px;margin:0">SKYPIP</h1><p><i>🐦 A paper bird's classroom flight ✏️</i></p>
<button onclick="go()">${sv.max>1?'▶ Continue (L'+sv.max+')':'▶ Play Campaign'}</button><button class="s" onclick="quick=1;qs=0;chunk=0;start(1,1)">♾ Quick Flight</button><button class="s" onclick="lsel()">🗺 Level Select</button>
<button class="s" onclick="howto('menu()')">❓ How to Play</button><button class="s" onclick="settings()">⚙ Settings & Themes</button>`)}
function lsel(){S='menu';let b='';for(let k=1;k<=100;k++){const n=selW*100+k,u=n<=sv.max,s=(sv.best[n]||[0])[0];b+=`<button class="${s?'':'s'}" ${u?'':'disabled'} onclick="start(${n})">${n}${s?'<br>'+'★'.repeat(s):''}</button>`}
 show(`<h1>${WN[selW]}</h1><div class="t">${WN.map((x,k)=>`<button class="${k==selW?'':'s'}" onclick="selW=${k};lsel()">${k+1}</button>`).join('')}</div><div class="g">${b}</div><button class="s" onclick="menu()">Back</button>`)}
function dev(){show(`<h1>Validation</h1><pre>${batch()}</pre><button class="s" onclick="menu()">Back</button>`)}
menu();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){/* register sw.js here when hosted */}
</script></body></html>
