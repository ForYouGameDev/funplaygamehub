 if(!MUSIC_URL&&AC&&S.mus&&st=="play"){const i=mstep++;tone(BASS[i>>1&7],.22,"sawtooth",.045,0,"mus");if(i%2)tone(ARP[i&7]*(i&8?1.5:1),.1,"square",.018,0,"mus");if(i%4==0)tone(60,.1,"sine",.08,-30,"mus")}
