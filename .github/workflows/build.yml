name: Build APK and AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
        
      - name: Set AdMob App ID in manifest
        run: |
          node scripts/patch-android.js
          grep -q "com.google.android.gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml
      
      - name: Set SDK levels (min 25, target 36)
        run: |
          sed -i "s/minSdkVersion = [0-9]*/minSdkVersion = 25/; s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" android/variables.gradle
          # SDK 36 ke liye naya Android Gradle Plugin + Gradle chahiye
          sed -i -E "s#(com.android.tools.build:gradle:)[0-9.]+#\18.9.1#" android/build.gradle
          sed -i -E "s#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.11.1-all.zip#" android/gradle/wrapper/gradle-wrapper.properties
          cat android/variables.gradle
          grep -n "com.android.tools.build" android/build.gradle
          grep -n "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties

      - name: Set app version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \".*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle  
            
      - name: Generate app icons
        run: bash scripts/make-icons.sh
          
      - name: Prepare signing key
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -alias mygamehub \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mygamehub123 -keypass mygamehub123 \
              -dname "CN=My Game Hub, O=MyGameHub, C=IN"
          fi

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign APK and AAB
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD || 'mygamehub123' }}"
          ALIAS="${{ secrets.KEY_ALIAS || 'mygamehub' }}"
          mkdir -p out
          $BT/zipalign -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-key-alias "$ALIAS" \
            --ks-pass pass:$STORE_PASS --key-pass pass:$STORE_PASS \
            --out out/ZokiPlayz.apk out/aligned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/ZokiPlayz.aab
          jarsigner -keystore release.keystore -storepass $STORE_PASS -keypass $STORE_PASS \
            out/ZokiPlayz.aab "$ALIAS"
          rm out/aligned.apk
          cp release.keystore out/release.keystore
          unzip -tq out/ZokiPlayz.apk
          unzip -tq out/ZokiPlayz.aab
          sha256sum out/ZokiPlayz.apk out/ZokiPlayz.aab

      - name: Publish APK and AAB as direct downloads (no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            out/ZokiPlayz.apk
            out/ZokiPlayz.aab

      - uses: actions/upload-artifact@v4
        with:
          name: ZokiPlayz-APK-AAB
          path: out/
